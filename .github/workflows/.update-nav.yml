name: 基準価額データの更新

on:
  # 「Actions」タブから手動実行できます。
  # 協会コードを入れるとその銘柄を追加し、空欄なら登録済み銘柄を更新します。
  workflow_dispatch:
    inputs:
      codes:
        description: '追加する銘柄。「協会コード,ISINコード」の形式で入力（例: 04318178,JP90C000GKC6）。複数銘柄は半角スペース区切り。空欄なら登録済み銘柄の更新のみ'
        required: false
        default: ''
  # 平日 21:30 JST（= 12:30 UTC）に自動更新
  schedule:
    - cron: '30 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-nav
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 基準価額を取得
        env:
          INPUT_CODES: ${{ github.event.inputs.codes }}
        run: |
          python3 - <<'PY'
          # -*- coding: utf-8 -*-
          """投資信託協会から基準価額CSVを取得し data/<協会コード>.csv に保存する。"""
          import csv, http.cookiejar, io, json, os, re, sys, time
          import urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta

          DATA  = "data"
          FUNDS = os.path.join(DATA, "funds.txt")
          INDEX = os.path.join(DATA, "index.json")
          CSV_EP = "https://toushin-lib.fwg.ne.jp/FdsWeb/FDST030000/csv-file-download"
          DETAIL = "https://toushin-lib.fwg.ne.jp/FdsWeb/FDST030000"
          TOP    = "https://toushin-lib.fwg.ne.jp/FdsWeb/FDST000000"
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          JST = timezone(timedelta(hours=9))
          DATE_RE = re.compile(r"(\d{4})\D+(\d{1,2})\D+(\d{1,2})")
          log = lambda *a: print(*a, flush=True)

          os.makedirs(DATA, exist_ok=True)

          # ---- funds.txt の読み書き -------------------------------------
          def read_funds():
              out = []
              if os.path.exists(FUNDS):
                  for line in open(FUNDS, encoding="utf-8"):
                      line = line.split("#")[0].strip()
                      if not line:
                          continue
                      parts = [p.strip() for p in line.replace("\t", ",").split(",")]
                      if re.fullmatch(r"[0-9A-Za-z]{8}", parts[0]):
                          out.append((parts[0],
                                      parts[1] if len(parts) > 1 and parts[1] else None,
                                      parts[2] if len(parts) > 2 else ""))
                      else:
                          log("  ! 協会コードの形式が不正なので無視します: " + parts[0])
              return out

          if not os.path.exists(FUNDS):
              open(FUNDS, "w", encoding="utf-8").write(
                  "# 基準価額を取得する銘柄の一覧（1行に1つ、協会コード8桁）\n"
                  "# 書き方: コード, ISIN(省略可), 銘柄名メモ\n\n")

          # 入力は「協会コード,ISIN」を1銘柄とし、複数銘柄は空白・改行・「;」で区切る
          added = []
          for entry in re.split(r"[;\s]+", os.environ.get("INPUT_CODES", "") or ""):
              entry = entry.strip()
              if not entry:
                  continue
              parts = [p.strip() for p in entry.split(",")]
              code = parts[0]
              isin = parts[1] if len(parts) > 1 and parts[1] else ""
              if not re.fullmatch(r"[0-9A-Za-z]{8}", code):
                  log("「%s」は協会コード（英数字8桁）ではないので無視します。" % code)
                  continue
              if isin and not re.fullmatch(r"[A-Z]{2}[0-9A-Z]{10}", isin.upper()):
                  log("「%s」はISINコードの形式ではないので無視します。" % isin)
                  isin = ""
              known = {}
              for f in read_funds():
                  known[f[0]] = (f[1] or known.get(f[0]) or "")
              if code in known:
                  if not isin:
                      log("%s はすでに登録済みです。" % code)
                      continue
                  if known[code].upper() == isin.upper():
                      log("%s は同じ ISIN ですでに登録済みです。" % code)
                      continue
                  log("%s の ISIN を %s → %s に更新します。"
                      % (code, known[code] or "（未設定）", isin.upper()))
              open(FUNDS, "a", encoding="utf-8").write(
                  code + ("," + isin.upper() if isin else "") + "\n")
              added.append(code + (" (" + isin.upper() + ")" if isin else ""))
          if added:
              log("data/funds.txt に追加しました: " + ", ".join(added))

          funds = read_funds()
          if not funds:
              log("data/funds.txt に協会コードが1件もありません。")
              log("Actions の「Run workflow」で協会コード（例 04318178）を入力してください。")
              sys.exit(0)

          # ---- 取得 -----------------------------------------------------
          def http_get(url, opener=None, referer=None, timeout=60):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "text/csv,application/csv,text/html,*/*;q=0.8",
                  "Accept-Language": "ja,en-US;q=0.8,en;q=0.6",
                  **({"Referer": referer} if referer else {})})
              op = opener.open if opener else urllib.request.urlopen
              with op(req, timeout=timeout) as res:
                  return res.read(), dict(res.headers)

          def decode(raw):
              for enc in ("cp932", "utf-8-sig", "utf-8", "euc_jp"):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return raw.decode("cp932", errors="replace")

          def ok(text):
              # エラー応答（1行のJSON）を弾きつつ、設定直後で行数の少ないファンドも通す
              return ("年月日" in text or "基準価" in text) and text.count("\n") >= 3

          def plain(code, isin):
              return http_get(CSV_EP + "?" + urllib.parse.urlencode({"associFundCd": code}))

          def with_isin(code, isin):
              return http_get(CSV_EP + "?" + urllib.parse.urlencode(
                  {"associFundCd": code, "isinCd": isin}))

          def with_session(code, isin):
              jar = http.cookiejar.CookieJar()
              op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
              ref = DETAIL + "?" + urllib.parse.urlencode(
                  {"isinCd": isin or "", "associFundCd": code})
              for u in (TOP, ref):
                  try:
                      http_get(u, opener=op, timeout=30)
                  except Exception:
                      pass
              time.sleep(1.0)
              q = {"associFundCd": code}
              if isin:
                  q["isinCd"] = isin
              return http_get(CSV_EP + "?" + urllib.parse.urlencode(q), opener=op, referer=ref)

          def fetch(code, isin, attempts=3):
              ways = ([("ISIN付きで取得", with_isin)] if isin else []) + [("そのまま取得", plain)]
              ways.append(("セッションを張って取得", with_session))
              last = "原因不明"
              for n in range(1, attempts + 1):
                  for name, fn in ways:
                      try:
                          raw, hdrs = fn(code, isin)
                          text = decode(raw)
                          if ok(text):
                              log("    ✓ %s（%d回目）" % (name, n))
                              return text, hdrs.get("Content-Disposition", "")
                          last = "%s: CSVではない応答 [%s]" % (
                              name, text.strip().replace("\n", " ")[:80])
                      except urllib.error.HTTPError as e:
                          last = "%s: HTTP %s" % (name, e.code)
                      except Exception as e:
                          last = "%s: %s" % (name, e)
                      log("    - " + last)
                      time.sleep(1.5)
                  if n < attempts:
                      log("    …%d秒待って再試行" % (5 * n))
                      time.sleep(5 * n)
              raise RuntimeError(last)

          # ---- 銘柄名の自動取得 -----------------------------------------
          def name_from_disposition(disp):
              if not disp:
                  return ""
              m = re.search(r"filename\*=UTF-8''([^;]+)", disp)
              s = urllib.parse.unquote(m.group(1)) if m else ""
              if not s:
                  m = re.search(r'filename="?([^";]+)"?', disp)
                  if m:
                      try:
                          s = urllib.parse.unquote(m.group(1))
                      except Exception:
                          s = m.group(1)
              s = re.sub(r"\.csv$", "", s or "", flags=re.I).strip()
              # ファイル名がコードや日付だけなら銘柄名ではない
              return "" if re.fullmatch(r"[-_0-9A-Za-z]*", s) else s

          def name_from_web(code):
              for url, pat in (
                      ("https://itf.minkabu.jp/fund/%s" % code, r"<title>(.*?)</title>"),
                      ("https://fund.monex.co.jp/detail/%s" % code, r"<title>(.*?)</title>")):
                  try:
                      raw, _ = http_get(url, timeout=20)
                      m = re.search(pat, decode(raw), re.S | re.I)
                      if not m:
                          continue
                      t = re.sub(r"\s+", " ", m.group(1)).strip()
                      t = re.split(r"[|｜]", t)[0]
                      t = re.sub(r"(の基準価[額格].*|：.*|:.*|投資信託\s*$)", "", t).strip()
                      t = re.sub(r"^\s*投資信託\s*", "", t).strip()
                      if t and len(t) < 80:
                          log("    銘柄名: %s（%s より取得）" % (t, url.split("/")[2]))
                          return t
                  except Exception as e:
                      log("    （%s からの銘柄名取得に失敗: %s）" % (url.split("/")[2], e))
                  time.sleep(1.0)
              return ""

          # ---- 正規化 ---------------------------------------------------
          def num(s):
              s = (s or "").strip().replace(",", "").replace("　", "")
              if s in ("", "-", "－", "―"):
                  return None
              try:
                  return float(s)
              except ValueError:
                  return None

          def normalize(text):
              recs = [r for r in csv.reader(io.StringIO(text)) if any(c.strip() for c in r)]
              if not recs:
                  raise ValueError("空のCSV")
              head = [h.strip().replace(" ", "").replace("　", "") for h in recs[0]]
              i_date = i_nav = i_div = None
              for i, h in enumerate(head):
                  if i_date is None and ("年月日" in h or "日付" in h or "基準日" in h):
                      i_date = i
                  elif i_nav is None and "基準価" in h:
                      i_nav = i
                  elif i_div is None and "分配金" in h:
                      i_div = i
              i_date = 0 if i_date is None else i_date
              i_nav  = 1 if i_nav  is None else i_nav
              if i_div is None:
                  i_div = 3 if len(head) > 3 else None
              rows = []
              for rec in recs[1:]:
                  c = [x.strip() for x in rec]
                  if len(c) <= max(i_nav, i_date):
                      continue
                  m = DATE_RE.search(c[i_date])
                  if not m:
                      continue
                  nav = num(c[i_nav])
                  if nav is None or nav <= 0:
                      continue
                  div = 0.0
                  if i_div is not None and len(c) > i_div:
                      div = num(c[i_div]) or 0.0
                  rows.append(("%04d-%02d-%02d" % tuple(int(g) for g in m.groups()), nav, div))
              rows.sort(key=lambda r: r[0])
              if len(rows) < 2:
                  raise ValueError("データ行が足りません（%d行）" % len(rows))
              return rows

          # ---- 本体 -----------------------------------------------------
          index = {}
          if os.path.exists(INDEX):
              try:
                  index = json.load(open(INDEX, encoding="utf-8"))
              except Exception:
                  index = {}

          # 同じ協会コードが複数行ある場合は、あとから書かれた内容を優先する
          # （ISIN を書き直したときに、新しいほうが使われるようにするため）
          uniq = {}
          for code, isin, memo in funds:
              cur = uniq.get(code, (None, ""))
              uniq[code] = (isin or cur[0], memo or cur[1])
          funds = [(c, v[0], v[1]) for c, v in uniq.items()]

          good = bad = 0
          for code, isin, memo in funds:
              log("[%s] 取得中…%s" % (code, ("（ISIN: %s）" % isin) if isin else ""))
              try:
                  text, disp = fetch(code, isin)
                  rows = normalize(text)
              except Exception as e:
                  log("  × 失敗: %s" % e)
                  if not isin:
                      log("    ヒント: この銘柄は ISIN コードが必要な可能性があります。")
                      log("    Actions の Run workflow で「%s,JP90C0000000」の形式で" % code)
                      log("    ISIN を指定して再実行してください。")
                  bad += 1
                  continue
              with open(os.path.join(DATA, code + ".csv"), "w",
                        encoding="utf-8", newline="\n") as f:
                  f.write("date,nav,div\n")
                  for d, nav, div in rows:
                      f.write("%s,%g,%g\n" % (d, nav, div))
              name = (memo or name_from_disposition(disp)
                      or index.get(code, {}).get("name", "") or name_from_web(code))
              index[code] = {"name": name, "isin": isin or "",
                             "first": rows[0][0], "last": rows[-1][0], "rows": len(rows),
                             "updated": datetime.now(JST).strftime("%Y-%m-%d %H:%M")}
              log("  ○ %s  %d行  %s 〜 %s" % (name or "（銘柄名なし）", len(rows),
                                              rows[0][0], rows[-1][0]))
              log("     最新の基準価額: %s 円（%s）— 運用会社の公表値と一致するか確認できます"
                  % (format(int(round(rows[-1][1])), ","), rows[-1][0]))
              good += 1
              time.sleep(2.0)

          json.dump(index, open(INDEX, "w", encoding="utf-8"),
                    ensure_ascii=False, indent=1, sort_keys=True)
          log("\n完了: 成功 %d 件 / 失敗 %d 件" % (good, bad))
          if good == 0 and bad > 0:
              log("すべて失敗しました。協会コードが正しいか確認してください。")
              sys.exit(1)
          PY

      - name: 変更をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "更新はありませんでした。"
          else
            git commit -m "基準価額データを更新"
            git push
          fi
